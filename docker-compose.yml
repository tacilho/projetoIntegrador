services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: brinquedoteca
      POSTGRES_USER: brinquedoteca
      POSTGRES_PASSWORD: brinquedoteca
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brinquedoteca -d brinquedoteca"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "8081:80"

volumes:
  db-data:
