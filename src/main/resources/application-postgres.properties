spring.datasource.url=jdbc:postgresql://db:5432/brinquedoteca
spring.datasource.username=brinquedoteca
spring.datasource.password=brinquedoteca
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/V1__create_tables.sql
