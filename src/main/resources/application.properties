spring.application.name=brinquedoteca-backend

spring.datasource.url=jdbc:h2:mem:brinquedoteca;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=none

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/V1__create_tables.sql

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
