spring.application.name=brinquedoteca-backend

# Configura��o do PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/brinquedoteca
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Desativa a gera��o autom�tica de schema pelo Hibernate
spring.jpa.hibernate.ddl-auto=none

# Executa o script schema.sql na inicializa��o
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/V1__create_tables.sql

# Mostra os comandos SQL no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true